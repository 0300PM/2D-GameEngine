name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  native:
    name: C++ core (build, tests, benchmark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake -S native/core -B build-native -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-native --parallel
      - name: Test
        run: ctest --test-dir build-native --output-on-failure
      - name: Benchmark
        run: ./build-native/bench_core

  wasm:
    name: C++ core to WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.61
      - name: Build module
        run: emcmake cmake -S native/core -B build-wasm -DCMAKE_BUILD_TYPE=Release && cmake --build build-wasm --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: core-wasm
          path: |
            build-wasm/core.js
            build-wasm/core.wasm
          if-no-files-found: error

  verify:
    name: Types, tests, budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm run test:unit
      - run: npm run examples:check
      - run: npm run bench:check
      - run: npm run build
      - run: npm run bundle:check
      - run: npm run audit:licenses:check
      - run: npm run release:check

  e2e:
    name: End-to-end suites
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run build
      - run: npm run test:scenarios
      - run: npm run test:matrix
      - run: npm run test:compat
      - run: npm run test:hosting

  examples:
    name: Examples (native host)
    runs-on: ubuntu-latest
    needs: native
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run native:example
      - run: npm run native:bench
      - uses: actions/upload-artifact@v4
        with:
          name: native-benchmarks
          path: benchmarks/native-latest.json
